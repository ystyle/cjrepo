name: 构建发布

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 构建前端
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build-only

      - name: 构建文档
        run: cd docs-site && pnpm install --frozen-lockfile && DOCS_BASE=/cjrepo/docs/ pnpm build

      - name: 构建 Linux amd64
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_VERSION=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 go build \
            -ldflags "-w -s -X 'main.buildDate=$BUILD_DATE' -X 'main.gitCommit=$GIT_COMMIT' -X 'main.gitVersion=$GIT_VERSION'" \
            -o cjrepo-linux-amd64 .
        env:
          GOOS: linux
          GOARCH: amd64

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cjrepo-linux-amd64
          generate_release_notes: true
