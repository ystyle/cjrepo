version: '3.8'

services:
  cjrepo:
    # 也可以直接使用预构建镜像：
    # image: ghcr.io/ystyle/cjrepo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cjrepo
    ports:
      - "8060:8060"
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化存储的包文件
      - ./storage:/app/storage
    environment:
      # 管理员密钥（必需，请修改为随机字符串）
      - CJREPO_ADMIN_KEY=your-secret-admin-key-change-me-in-production
      # 站点名称（可选）
      - CJREPO_SITE_NAME=仓颉包仓库
      # 默认组织（可选）：企业私有仓库建议配置
      # - CJREPO_DEFAULT_ORGANIZATION=company
      # 强制认证（可选，默认 false）：开启后下载和索引也需要 token
      # 如果需要私有仓库模式，取消下面这行的注释：
      # - CJREPO_REQUIRE_AUTH=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
